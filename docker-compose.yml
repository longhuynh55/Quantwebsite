name: quant-website
services:
  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        INSTALL_DUCKDB_BINDING: ${INSTALL_DUCKDB_BINDING:-true}
    working_dir: /app
    command: >
      sh -c "corepack enable
      && if [ ! -d node_modules/next ]; then pnpm install --frozen-lockfile; fi
      && pnpm run dev -p 3000"
    ports:
      - "3010:3000"
    env_file:
      - ./.env.glm
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NPM_CONFIG_OPTIONAL: "true"
      DATA_DIR: /app/public/data
      DATA_BACKEND: ${DATA_BACKEND:-auto}
      DATA_BACKEND_STRICT: ${DATA_BACKEND_STRICT:-false}
      ASSISTANT_PROVIDER_PRIORITY: openrouter,glm,fallback
      ASSISTANT_OPENROUTER_ONLY: "true"
      ASSISTANT_BASELINE_ONLY: "false"
      ASSISTANT_POLICY_MODE: shadow
      ASSISTANT_QUERY_PLAN_STRICT: ${ASSISTANT_QUERY_PLAN_STRICT:-true}
      ASSISTANT_TOOL_TIMEOUT_MS: ${ASSISTANT_TOOL_TIMEOUT_MS:-30000}
      ASSISTANT_TOOL_MAX_CALLS_PER_TURN: ${ASSISTANT_TOOL_MAX_CALLS_PER_TURN:-8}
      ASSISTANT_TOOL_FETCH_MAX_ATTEMPTS: ${ASSISTANT_TOOL_FETCH_MAX_ATTEMPTS:-2}
      ASSISTANT_TOOL_FETCH_RETRY_BACKOFF_MS: ${ASSISTANT_TOOL_FETCH_RETRY_BACKOFF_MS:-300}
      ASSISTANT_TOOL_TRANSIENT_FAILURE_CIRCUIT_THRESHOLD: ${ASSISTANT_TOOL_TRANSIENT_FAILURE_CIRCUIT_THRESHOLD:-3}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-120b:free}
      OPENROUTER_SECONDARY_MODEL: ${OPENROUTER_SECONDARY_MODEL:-openai/gpt-oss-120b}
      OPENROUTER_TERTIARY_MODEL: ${OPENROUTER_TERTIARY_MODEL:-openai/gpt-oss-20b:free}
      OPENROUTER_MAX_TOKENS: ${OPENROUTER_MAX_TOKENS:-2048}
      OPENROUTER_SECONDARY_MAX_TOKENS: ${OPENROUTER_SECONDARY_MAX_TOKENS:-2048}
      OPENROUTER_TERTIARY_MAX_TOKENS: ${OPENROUTER_TERTIARY_MAX_TOKENS:-1536}
      STRATEGY_PARSE_REPAIR_RETRIES: ${STRATEGY_PARSE_REPAIR_RETRIES:-1}
      ASSISTANT_EVAL_RATE_LIMIT_MAX: "240"
      ASSISTANT_EVAL_AUTH_TOKEN: ${ASSISTANT_EVAL_AUTH_TOKEN:-dev-eval-token}
      ASSISTANT_TOOL_BASE_URL: http://127.0.0.1:3000
      GLM_REQUEST_TIMEOUT_MS: ${GLM_REQUEST_TIMEOUT_MS:-90000}
      OPENROUTER_TIMEOUT_MS: ${OPENROUTER_TIMEOUT_MS:-90000}
      GLM_FALLBACK_TIMEOUT_MS: ${GLM_FALLBACK_TIMEOUT_MS:-90000}
      INSTALL_DUCKDB_BINDING: ${INSTALL_DUCKDB_BINDING:-true}
    volumes:
      - ./:/app
      - node_modules_cache:/app/node_modules
      - ./public/data:/app/public/data:ro
      - ../data:/workspace-data:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health/data?probe=true&canary=true&includeFundamentals=false').then(async (r)=>{if(!r.ok)process.exit(1);const j=await r.json().catch(()=>null);if(!j?.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  smoke:
    image: node:20-bookworm-slim
    working_dir: /app
    command: ["node", "scripts/smoke.mjs"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      SMOKE_BASE_URL: http://app:3000
      DATA_DIR: /app/public/data
      ASSISTANT_EVAL_AUTH_TOKEN: ${ASSISTANT_EVAL_AUTH_TOKEN:-dev-eval-token}
      NPM_CONFIG_OPTIONAL: "true"
    volumes:
      - ./:/app:ro
      - node_modules_cache:/app/node_modules:ro
      - ./artifacts:/app/artifacts
      - ../data:/workspace-data:ro

  qa:
    image: node:20-bookworm-slim
    working_dir: /app
    command: ["node", "scripts/qa.mjs"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      SMOKE_BASE_URL: http://app:3000
      DATA_DIR: /app/public/data
      NPM_CONFIG_OPTIONAL: "true"
    volumes:
      - ./:/app:ro
      - node_modules_cache:/app/node_modules:ro
      - ./artifacts:/app/artifacts
      - ../data:/workspace-data:ro

  app-prod:
    profiles: ["prod"]
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DUCKDB_BINDING: ${INSTALL_DUCKDB_BINDING:-true}
    ports:
      - "${APP_PROD_PORT:-3011}:3000"
    env_file:
      - ./.env.glm
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${APP_PROD_NODE_OPTIONS:---max-old-space-size=4096}
      NEXT_TELEMETRY_DISABLED: "1"
      NPM_CONFIG_OPTIONAL: "true"
      ASSISTANT_EXECUTE_FETCH_TIMEOUT_MS: ${ASSISTANT_EXECUTE_FETCH_TIMEOUT_MS:-90000}
      DATA_DIR: /app/public/data
      DATA_BACKEND: ${DATA_BACKEND:-auto}
      DATA_BACKEND_STRICT: ${DATA_BACKEND_STRICT:-false}
      DATA_DUCKDB_PATH: /app/public/data/quant_data.duckdb
      DATA_ALLOW_RAW_FALLBACK: ${DATA_ALLOW_RAW_FALLBACK:-true}
      ASSISTANT_PROVIDER_PRIORITY: openrouter,glm,fallback
      ASSISTANT_OPENROUTER_ONLY: "true"
      ASSISTANT_BASELINE_ONLY: "false"
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-120b:free}
      OPENROUTER_SECONDARY_MODEL: ${OPENROUTER_SECONDARY_MODEL:-openai/gpt-oss-120b}
      OPENROUTER_TERTIARY_MODEL: ${OPENROUTER_TERTIARY_MODEL:-openai/gpt-oss-20b:free}
      OPENROUTER_MAX_TOKENS: ${OPENROUTER_MAX_TOKENS:-2048}
      OPENROUTER_SECONDARY_MAX_TOKENS: ${OPENROUTER_SECONDARY_MAX_TOKENS:-2048}
      OPENROUTER_TERTIARY_MAX_TOKENS: ${OPENROUTER_TERTIARY_MAX_TOKENS:-1536}
      STRATEGY_PARSE_REPAIR_RETRIES: ${STRATEGY_PARSE_REPAIR_RETRIES:-1}
      ASSISTANT_EVAL_RATE_LIMIT_MAX: "240"
      ASSISTANT_EVAL_AUTH_TOKEN: ${ASSISTANT_EVAL_AUTH_TOKEN:-}
      ASSISTANT_EXECUTE_APPROVAL_TOKEN: ${ASSISTANT_EXECUTE_APPROVAL_TOKEN:-}
      ASSISTANT_TOOL_BASE_URL: http://127.0.0.1:3000
      GLM_REQUEST_TIMEOUT_MS: ${GLM_REQUEST_TIMEOUT_MS:-90000}
      OPENROUTER_TIMEOUT_MS: ${OPENROUTER_TIMEOUT_MS:-90000}
      GLM_FALLBACK_TIMEOUT_MS: ${GLM_FALLBACK_TIMEOUT_MS:-90000}
      ASSISTANT_POLICY_MODE: shadow
      ASSISTANT_QUERY_PLAN_STRICT: ${ASSISTANT_QUERY_PLAN_STRICT:-true}
      ASSISTANT_TOOL_TIMEOUT_MS: ${ASSISTANT_TOOL_TIMEOUT_MS:-30000}
      ASSISTANT_TOOL_MAX_CALLS_PER_TURN: ${ASSISTANT_TOOL_MAX_CALLS_PER_TURN:-8}
      ASSISTANT_TOOL_FETCH_MAX_ATTEMPTS: ${ASSISTANT_TOOL_FETCH_MAX_ATTEMPTS:-2}
      ASSISTANT_TOOL_FETCH_RETRY_BACKOFF_MS: ${ASSISTANT_TOOL_FETCH_RETRY_BACKOFF_MS:-300}
      ASSISTANT_TOOL_TRANSIENT_FAILURE_CIRCUIT_THRESHOLD: ${ASSISTANT_TOOL_TRANSIENT_FAILURE_CIRCUIT_THRESHOLD:-3}
      INSTALL_DUCKDB_BINDING: ${INSTALL_DUCKDB_BINDING:-true}
    volumes:
      - ./public/data:/app/public/data:ro
      - ../data:/workspace-data:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health/data?probe=true&canary=true&includeFundamentals=false').then(async (r)=>{if(!r.ok)process.exit(1);const j=await r.json().catch(()=>null);if(!j?.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  smoke-prod:
    profiles: ["prod"]
    image: node:20-bookworm-slim
    working_dir: /app
    command: >
      sh -c "corepack enable
      && if [ ! -d node_modules/next ]; then pnpm install --frozen-lockfile; fi
      && node scripts/smoke.mjs"
    depends_on:
      app-prod:
        condition: service_healthy
    environment:
      SMOKE_BASE_URL: http://app-prod:3000
      DATA_DIR: /app/public/data
      ASSISTANT_EVAL_AUTH_TOKEN: ${ASSISTANT_EVAL_AUTH_TOKEN:-dev-eval-token}
      NPM_CONFIG_OPTIONAL: "true"
    volumes:
      - ./:/app
      - smoke_node_modules_cache:/app/node_modules
      - ./artifacts:/app/artifacts
      - ../data:/workspace-data:ro

  qa-prod:
    profiles: ["prod"]
    image: node:20-bookworm-slim
    working_dir: /app
    command: >
      sh -c "corepack enable
      && if [ ! -d node_modules/next ]; then pnpm install --frozen-lockfile; fi
      && node scripts/qa.mjs"
    depends_on:
      app-prod:
        condition: service_healthy
    environment:
      SMOKE_BASE_URL: http://app-prod:3000
      DATA_DIR: /app/public/data
      NPM_CONFIG_OPTIONAL: "true"
    volumes:
      - ./:/app
      - smoke_node_modules_cache:/app/node_modules
      - ./artifacts:/app/artifacts
      - ../data:/workspace-data:ro

volumes:
  node_modules_cache:
  smoke_node_modules_cache:

