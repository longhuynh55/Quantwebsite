services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        INSTALL_DUCKDB_BINDING: ${INSTALL_DUCKDB_BINDING:-true}
    working_dir: /app
    command: >
      sh -c "if [ ! -d node_modules/next ]; then npm ci --legacy-peer-deps; fi
      && if [ \"${INSTALL_DUCKDB_BINDING:-true}\" = \"true\" ] && [ ! -d node_modules/duckdb ]; then npm install duckdb --no-save --legacy-peer-deps; fi
      && npm run dev -- -p 3000"
    ports:
      - "3010:3000"
    env_file:
      - ./.env.glm
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      DATA_DIR: /app/public/data
      DATA_BACKEND: ${DATA_BACKEND:-auto}
      DATA_BACKEND_STRICT: ${DATA_BACKEND_STRICT:-false}
      ASSISTANT_PROVIDER_PRIORITY: openrouter,glm,fallback
      ASSISTANT_OPENROUTER_ONLY: "true"
      ASSISTANT_BASELINE_ONLY: "false"
      ASSISTANT_POLICY_MODE: enforce_high_risk
      ASSISTANT_TOOL_TIMEOUT_MS: ${ASSISTANT_TOOL_TIMEOUT_MS:-30000}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-120b:free}
      OPENROUTER_SECONDARY_MODEL: ${OPENROUTER_SECONDARY_MODEL:-openai/gpt-oss-20b:free}
      OPENROUTER_TERTIARY_MODEL: ${OPENROUTER_TERTIARY_MODEL:-stepfun/step-3.5-flash:free}
      ASSISTANT_EVAL_RATE_LIMIT_MAX: "240"
      ASSISTANT_EVAL_AUTH_TOKEN: ${ASSISTANT_EVAL_AUTH_TOKEN:-dev-eval-token}
      ASSISTANT_TOOL_BASE_URL: http://127.0.0.1:3000
      GLM_REQUEST_TIMEOUT_MS: ${GLM_REQUEST_TIMEOUT_MS:-90000}
      OPENROUTER_TIMEOUT_MS: ${OPENROUTER_TIMEOUT_MS:-90000}
      GLM_FALLBACK_TIMEOUT_MS: ${GLM_FALLBACK_TIMEOUT_MS:-90000}
      INSTALL_DUCKDB_BINDING: ${INSTALL_DUCKDB_BINDING:-true}
    volumes:
      - ./:/app
      - node_modules_cache:/app/node_modules
      - ./public/data:/app/public/data:ro
      - ../data:/workspace-data:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health/data?probe=true&includeFundamentals=false').then(async (r)=>{if(!r.ok)process.exit(1);const j=await r.json().catch(()=>null);if(!j?.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  smoke:
    image: node:20-bookworm-slim
    working_dir: /app
    command: ["node", "scripts/smoke.mjs"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      SMOKE_BASE_URL: http://app:3000
      DATA_DIR: /app/public/data
      ASSISTANT_EVAL_AUTH_TOKEN: ${ASSISTANT_EVAL_AUTH_TOKEN:-dev-eval-token}
    volumes:
      - ./:/app:ro
      - ../data:/workspace-data:ro

  qa:
    image: node:20-bookworm-slim
    working_dir: /app
    command: ["node", "scripts/qa.mjs"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      SMOKE_BASE_URL: http://app:3000
      DATA_DIR: /app/public/data
    volumes:
      - ./:/app:ro
      - ../data:/workspace-data:ro

  app-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DUCKDB_BINDING: ${INSTALL_DUCKDB_BINDING:-true}
    ports:
      - "3011:3000"
    env_file:
      - ./.env.glm
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DATA_DIR: /app/public/data
      DATA_BACKEND: duckdb
      DATA_BACKEND_STRICT: "true"
      DATA_DUCKDB_PATH: /app/public/data/quant_data.duckdb
      DATA_ALLOW_RAW_FALLBACK: "false"
      ASSISTANT_PROVIDER_PRIORITY: openrouter,glm,fallback
      ASSISTANT_OPENROUTER_ONLY: "true"
      ASSISTANT_BASELINE_ONLY: "false"
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-120b:free}
      OPENROUTER_SECONDARY_MODEL: ${OPENROUTER_SECONDARY_MODEL:-openai/gpt-oss-20b:free}
      OPENROUTER_TERTIARY_MODEL: ${OPENROUTER_TERTIARY_MODEL:-stepfun/step-3.5-flash:free}
      ASSISTANT_EVAL_RATE_LIMIT_MAX: "240"
      ASSISTANT_EVAL_AUTH_TOKEN: ${ASSISTANT_EVAL_AUTH_TOKEN:-dev-eval-token}
      ASSISTANT_TOOL_BASE_URL: http://127.0.0.1:3000
      GLM_REQUEST_TIMEOUT_MS: ${GLM_REQUEST_TIMEOUT_MS:-90000}
      OPENROUTER_TIMEOUT_MS: ${OPENROUTER_TIMEOUT_MS:-90000}
      GLM_FALLBACK_TIMEOUT_MS: ${GLM_FALLBACK_TIMEOUT_MS:-90000}
      ASSISTANT_POLICY_MODE: enforce_high_risk
      ASSISTANT_TOOL_TIMEOUT_MS: ${ASSISTANT_TOOL_TIMEOUT_MS:-30000}
      INSTALL_DUCKDB_BINDING: ${INSTALL_DUCKDB_BINDING:-true}
    volumes:
      - ./public/data:/app/public/data:ro
      - ../data:/workspace-data:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health/data?probe=true&includeFundamentals=false').then(async (r)=>{if(!r.ok)process.exit(1);const j=await r.json().catch(()=>null);if(!j?.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  smoke-prod:
    profiles: ["prod"]
    image: node:20-bookworm-slim
    working_dir: /app
    command: ["node", "scripts/smoke.mjs"]
    depends_on:
      app-prod:
        condition: service_healthy
    environment:
      SMOKE_BASE_URL: http://app-prod:3000
      DATA_DIR: /app/public/data
      ASSISTANT_EVAL_AUTH_TOKEN: ${ASSISTANT_EVAL_AUTH_TOKEN:-dev-eval-token}
    volumes:
      - ./:/app:ro
      - ../data:/workspace-data:ro

  qa-prod:
    profiles: ["prod"]
    image: node:20-bookworm-slim
    working_dir: /app
    command: ["node", "scripts/qa.mjs"]
    depends_on:
      app-prod:
        condition: service_healthy
    environment:
      SMOKE_BASE_URL: http://app-prod:3000
      DATA_DIR: /app/public/data
    volumes:
      - ./:/app:ro
      - ../data:/workspace-data:ro

volumes:
  node_modules_cache:
