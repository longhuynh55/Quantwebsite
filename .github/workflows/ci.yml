# =============================================================================
# QuantVN CI/CD Pipeline
#
# Stages:
#   1. Build - Compile and build the application
#   2. Test  - Run unit tests
#   3. Lint  - Run linting and type checking
#   4. Deploy - Deploy to production (placeholder for deployment)
#
# Triggers:
#   - Push to main/master branches
#   - Pull requests to main/master branches
#   - Manual workflow dispatch
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  # ===========================================================================
  # Stage 1: Build
  # Compile TypeScript and build Next.js application
  # ===========================================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_DIST_DIR: .next-ci-build-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            .next-ci-build-${{ github.run_id }}-${{ github.run_attempt }}
            public
          retention-days: 1

  # ===========================================================================
  # Stage 2: Test
  # Run unit tests with coverage
  # ===========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:coverage
        env:
          CI: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 7

  # ===========================================================================
  # Stage 3: Lint
  # Run ESLint and TypeScript type checking
  # ===========================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript type check
        run: pnpm exec tsc --noEmit

  # ===========================================================================
  # Stage 3.5: Agent Function-Calling Verification
  # Enforce strict verification for assistant tool-calling contracts
  # ===========================================================================
  agent-advanced:
    name: Verify Agent Function Calling
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run advanced agent verification
        run: pnpm run verify:agent:advanced

  # ===========================================================================
  # Stage 3.6: Docker Assistant Eval (Release Gate)
  # Run strict assistant eval in Docker before release image build
  # ===========================================================================
  agent-progress:
    name: Agent Progress Tracking
    runs-on: ubuntu-latest
    needs: [build, agent-advanced]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync roadmap progress artifacts
        if: always()
        run: |
          pnpm run agent:track
          pnpm run agent:track:weekly

      - name: Add progress summary
        if: always()
        run: |
          if [ -f artifacts/composer-agent-progress-report.json ]; then
            node <<'EOF' >> "$GITHUB_STEP_SUMMARY"
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("artifacts/composer-agent-progress-report.json", "utf8"));
            const counts = report.summary?.countsByStatus ?? {};
            const actions = Array.isArray(report.summary?.nextActions) ? report.summary.nextActions : [];
            console.log("## Agent Progress Tracking");
            console.log(`- generated: ${report.generatedAt ?? "unknown"}`);
            console.log(`- tracker updated: ${report.trackerUpdatedAt ?? "unknown"}`);
            console.log(`- todo: ${counts.todo ?? 0}, in_progress: ${counts.in_progress ?? 0}, done: ${counts.done ?? 0}, blocked: ${counts.blocked ?? 0}`);
            if (actions.length === 0) {
              console.log("- next actions: none");
            } else {
              console.log("- next actions:");
              actions.slice(0, 5).forEach((action, index) => {
                console.log(`  ${index + 1}. ${action}`);
              });
            }
            EOF
          else
            echo "## Agent Progress Tracking" >> "$GITHUB_STEP_SUMMARY"
            echo "- report: not generated" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload progress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/composer-agent-progress-report.json
            artifacts/composer-agent-progress-board.md
            docs/COMPOSER_AGENT_WEEKLY_STATUS_AUTO.md
            docs/PROGRESS.md
          if-no-files-found: warn

  docker-assistant-eval:
    name: Docker Assistant Eval Gate
    runs-on: ubuntu-latest
    needs: [build, agent-advanced]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Validate OpenRouter secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "Missing required secret: OPENROUTER_API_KEY"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deterministic CI data prepare
        env:
          TZ: UTC
          LANG: C
          LC_ALL: C
        run: pnpm run data:generate:ci

      - name: Deterministic fundamentals validation
        env:
          TZ: UTC
          LANG: C
          LC_ALL: C
        run: pnpm run data:validate:fundamentals

      - name: Prepare .env.glm for Docker app
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          ASSISTANT_EVAL_AUTH_TOKEN: ${{ secrets.ASSISTANT_EVAL_AUTH_TOKEN }}
        run: |
          cat > .env.glm <<EOF
          OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
          GLM_API_KEY=${GLM_API_KEY:-}
          OPENROUTER_HTTP_REFERER=https://github.com/${GITHUB_REPOSITORY}
          OPENROUTER_X_TITLE=QuantVN-CI
          ASSISTANT_EVAL_AUTH_TOKEN=${ASSISTANT_EVAL_AUTH_TOKEN:-ci-eval-token}
          EOF
          echo "ASSISTANT_EVAL_AUTH_TOKEN=${ASSISTANT_EVAL_AUTH_TOKEN:-ci-eval-token}" >> "$GITHUB_ENV"

      - name: Start app container
        env:
          ASSISTANT_EVAL_AUTH_TOKEN: ${{ secrets.ASSISTANT_EVAL_AUTH_TOKEN }}
        run: docker compose up -d --build app

      - name: Wait for app health
        env:
          HEALTH_URL: http://localhost:3010/api/health/data?probe=true&canary=true&includeFundamentals=false
          HEALTH_MAX_ATTEMPTS: "40"
          HEALTH_RETRY_INTERVAL_SECONDS: "3"
          HEALTH_REQUEST_TIMEOUT_MS: "10000"
        run: |
          node <<'EOF'
          const url = process.env.HEALTH_URL;
          const maxAttempts = Number(process.env.HEALTH_MAX_ATTEMPTS || 40);
          const retryIntervalMs = Number(process.env.HEALTH_RETRY_INTERVAL_SECONDS || 3) * 1000;
          const requestTimeoutMs = Number(process.env.HEALTH_REQUEST_TIMEOUT_MS || 10000);
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          (async () => {
            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), requestTimeoutMs);
              try {
                const response = await fetch(url, { signal: controller.signal, headers: { Accept: "application/json" } });
                const body = await response.json().catch(() => null);
                if (response.ok && body?.ok) {
                  console.log(JSON.stringify({ status: "healthy", attempt }));
                  process.exit(0);
                }
                console.error(JSON.stringify({ status: "retry", attempt, httpStatus: response.status, body }));
              } catch (error) {
                console.error(JSON.stringify({ status: "retry", attempt, error: String(error) }));
              } finally {
                clearTimeout(timeout);
              }
              if (attempt < maxAttempts) {
                await sleep(retryIntervalMs);
              }
            }

            console.error(JSON.stringify({ status: "failed", attempts: maxAttempts }));
            process.exit(1);
          })();
          EOF

      - name: Run strict Docker assistant eval
        env:
          ASSISTANT_EVAL_AUTH_TOKEN: ${{ secrets.ASSISTANT_EVAL_AUTH_TOKEN }}
        run: docker compose run --rm -e ASSISTANT_EVAL_STRICT=true smoke node scripts/eval-assistant.mjs

      - name: Collect docker logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color --tail=300 app > artifacts/docker-assistant-eval.log

      - name: Upload assistant eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-assistant-eval-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/docker-assistant-eval.log
            artifacts/assistant-*.json
            artifacts/assistant-*.md
          if-no-files-found: warn

      - name: Shutdown containers
        if: always()
        run: docker compose down --remove-orphans

  # ===========================================================================
  # Stage 4: Docker Build
  # Build and push Docker image
  # ===========================================================================
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build, test, lint, agent-advanced, agent-progress, docker-assistant-eval]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            INSTALL_DUCKDB_BINDING=true

      - name: Output image digest
        run: echo ${{ steps.meta.outputs.digest }}

  # ===========================================================================
  # Stage 5: Deploy (Placeholder)
  # Deploy to staging/production environment
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: staging
      url: https://staging.quantvn.example.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "=========================================="
          echo "Deploying to Staging Environment"
          echo "=========================================="
          echo "Image: ghcr.io/${{ github.repository }}:latest"
          echo ""
          echo "TODO: Add deployment steps here"
          echo "Examples:"
          echo "  - SSH to server and pull new image"
          echo "  - Use kubectl to update Kubernetes deployment"
          echo "  - Use AWS ECS task definition update"
          echo "  - Use Azure Container Apps deployment"
          echo ""
          echo "Deployment placeholder completed successfully!"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://quantvn.example.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Deploy to production
        run: |
          echo "=========================================="
          echo "Deploying to Production Environment"
          echo "=========================================="
          echo "Version: ${{ steps.version.outputs.VERSION }}"
          echo "Image: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}"
          echo ""
          echo "TODO: Add deployment steps here"
          echo "Examples:"
          echo "  - SSH to server and pull tagged image"
          echo "  - Use kubectl to update Kubernetes deployment"
          echo "  - Use AWS ECS task definition update"
          echo "  - Use Azure Container Apps deployment"
          echo ""
          echo "Deployment placeholder completed successfully!"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            artifacts/*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
