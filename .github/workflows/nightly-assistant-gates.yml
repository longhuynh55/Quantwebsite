name: Nightly Assistant Gates

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-assistant-gates
  cancel-in-progress: true

jobs:
  nightly-evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare .env.glm for Docker app
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          ASSISTANT_EVAL_AUTH_TOKEN: ${{ secrets.ASSISTANT_EVAL_AUTH_TOKEN }}
          ASSISTANT_EXECUTE_APPROVAL_TOKEN: ${{ secrets.ASSISTANT_EXECUTE_APPROVAL_TOKEN }}
        run: |
          cat > .env.glm <<EOF
          OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
          OPENROUTER_HTTP_REFERER=https://github.com/${GITHUB_REPOSITORY}
          OPENROUTER_X_TITLE=QuantVN-Nightly-CI
          GLM_API_KEY=${GLM_API_KEY:-}
          ASSISTANT_EVAL_AUTH_TOKEN=${ASSISTANT_EVAL_AUTH_TOKEN:-ci-eval-token}
          ASSISTANT_EXECUTE_APPROVAL_TOKEN=${ASSISTANT_EXECUTE_APPROVAL_TOKEN:-ci-execute-token}
          EOF
          echo "ASSISTANT_EVAL_AUTH_TOKEN=${ASSISTANT_EVAL_AUTH_TOKEN:-ci-eval-token}" >> "$GITHUB_ENV"

      - name: Deterministic CI data prepare
        env:
          TZ: UTC
          LANG: C
          LC_ALL: C
        run: pnpm run data:generate:ci

      - name: Deterministic fundamentals validation
        env:
          TZ: UTC
          LANG: C
          LC_ALL: C
        run: pnpm run data:validate:fundamentals

      - name: Start app container
        run: docker compose up -d --build app

      - name: Health probe warmup and retry
        env:
          HEALTH_URL: http://localhost:3010/api/health/data?probe=true&canary=true&includeFundamentals=false
          HEALTH_LABEL: nightly
          HEALTH_WARMUP_SECONDS: "5"
          HEALTH_MAX_ATTEMPTS: "30"
          HEALTH_RETRY_INTERVAL_SECONDS: "2"
          HEALTH_REQUEST_TIMEOUT_MS: "10000"
        run: |
          sleep "${HEALTH_WARMUP_SECONDS}"
          node <<'EOF'
          const url = process.env.HEALTH_URL;
          const label = process.env.HEALTH_LABEL || "health";
          const maxAttempts = Number(process.env.HEALTH_MAX_ATTEMPTS || 30);
          const retryIntervalMs = Number(process.env.HEALTH_RETRY_INTERVAL_SECONDS || 2) * 1000;
          const requestTimeoutMs = Number(process.env.HEALTH_REQUEST_TIMEOUT_MS || 10000);

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          (async () => {
            if (!url) {
              console.error(JSON.stringify({ probe: label, status: "failed", reason: "missing_health_url" }));
              process.exit(1);
            }

            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), requestTimeoutMs);
              try {
                const response = await fetch(url, {
                  signal: controller.signal,
                  headers: { Accept: "application/json" },
                });
                const body = await response.json().catch(() => null);
                if (response.ok && body?.ok) {
                  console.log(JSON.stringify({ probe: label, status: "ok", attempt }));
                  process.exit(0);
                }
                console.error(JSON.stringify({ probe: label, status: "retry", attempt, httpStatus: response.status, body }));
              } catch (error) {
                console.error(JSON.stringify({ probe: label, status: "retry", attempt, error: String(error) }));
              } finally {
                clearTimeout(timeout);
              }

              if (attempt < maxAttempts) {
                await sleep(retryIntervalMs);
              }
            }

            console.error(JSON.stringify({ probe: label, status: "failed", attempts: maxAttempts }));
            process.exit(1);
          })();
          EOF

      - name: Assistant routing matrix stability gate
        id: assistant_routing
        run: pnpm run eval:assistant:routing:stable

      - name: AI strategy real-output stability gate
        id: ai_strategy_stability
        env:
          AI_STRATEGY_BASE_URL: http://localhost:3010
          AI_STRATEGY_STABILITY_RUNS: "20"
          AI_STRATEGY_MAX_FAILURE_RATE: "0.05"
          AI_STRATEGY_MAX_PARSE_FAILURE_RATE: "0.02"
          AI_STRATEGY_REPORT_PATH: artifacts/ai-strategy-stability-report.json
        run: pnpm run eval:ai-strategy:stability

      - name: Assistant policy matrix stability gate
        id: assistant_policy
        run: pnpm run eval:assistant:policy-matrix:stable

      - name: Assistant perf reliability stability gate
        id: assistant_perf
        run: pnpm run eval:assistant:perf-reliability:stable

      - name: Assistant realworld stability gate
        id: assistant_realworld
        run: pnpm run eval:assistant:realworld:stable

      - name: Assistant backtesting KPI matrix
        id: assistant_backtesting
        run: pnpm run eval:assistant:backtesting:kpi-matrix

      - name: Assistant comprehensive full stability (soft gate)
        id: assistant_full
        continue-on-error: true
        run: pnpm run eval:assistant:full:stable

      - name: Sync agent roadmap tracking
        if: always()
        run: |
          pnpm run agent:track
          pnpm run agent:track:weekly

      - name: Nightly full gate summary
        if: always()
        run: |
          echo "## Nightly Assistant Gates" >> $GITHUB_STEP_SUMMARY
          echo "- routing matrix: ${{ steps.assistant_routing.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- ai strategy stability: ${{ steps.ai_strategy_stability.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- policy matrix: ${{ steps.assistant_policy.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- perf reliability: ${{ steps.assistant_perf.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- realworld: ${{ steps.assistant_realworld.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- backtesting KPI: ${{ steps.assistant_backtesting.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- full stability (soft gate): ${{ steps.assistant_full.outcome }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.assistant_full.outcome }}" != "success" ]; then
            echo "assistant_full: soft_fail (non-blocking); inspect artifacts/assistant-eval-comprehensive-report.json" >> $GITHUB_STEP_SUMMARY
          else
            echo "assistant_full: pass" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f artifacts/composer-agent-progress-report.json ]; then
            node <<'EOF' >> "$GITHUB_STEP_SUMMARY"
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("artifacts/composer-agent-progress-report.json", "utf8"));
            const counts = report.summary?.countsByStatus ?? {};
            const actions = Array.isArray(report.summary?.nextActions) ? report.summary.nextActions : [];
            console.log("");
            console.log("## Composer Agent Progress");
            console.log(`- generated: ${report.generatedAt ?? "unknown"}`);
            console.log(`- tracker updated: ${report.trackerUpdatedAt ?? "unknown"}`);
            console.log(`- todo: ${counts.todo ?? 0}, in_progress: ${counts.in_progress ?? 0}, done: ${counts.done ?? 0}, blocked: ${counts.blocked ?? 0}`);
            if (actions.length === 0) {
              console.log("- next actions: none");
            } else {
              console.log("- next actions:");
              actions.slice(0, 5).forEach((action, index) => {
                console.log(`  ${index + 1}. ${action}`);
              });
            }
            EOF
          else
            echo "## Composer Agent Progress" >> "$GITHUB_STEP_SUMMARY"
            echo "- report: not generated" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload assistant artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-assistant-artifacts
          path: |
            artifacts/assistant-routing-matrix-report.json
            artifacts/ai-strategy-stability-report.json
            artifacts/assistant-policy-matrix-report.json
            artifacts/assistant-perf-reliability-report.json
            artifacts/assistant-realworld-report.json
            artifacts/backtesting-kpi-matrix-report.json
            artifacts/assistant-eval-comprehensive-report.json
            artifacts/assistant-eval-summary.md
            artifacts/composer-agent-progress-report.json
            artifacts/composer-agent-progress-board.md
            docs/COMPOSER_AGENT_WEEKLY_STATUS_AUTO.md
            docs/PROGRESS.md
          if-no-files-found: warn

      - name: Collect docker logs
        if: always()
        run: docker compose logs --tail=200 app

      - name: Shutdown containers
        if: always()
        run: docker compose down --remove-orphans
