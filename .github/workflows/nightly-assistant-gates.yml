name: Nightly Assistant Gates

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-assistant-gates
  cancel-in-progress: true

jobs:
  nightly-evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate CI data
        run: pnpm run data:generate:ci

      - name: Start app container
        run: docker compose up -d --build app

      - name: Health probe warmup and retry
        env:
          HEALTH_URL: http://localhost:3010/api/health/data?probe=true&includeFundamentals=false
          HEALTH_LABEL: nightly
          HEALTH_WARMUP_SECONDS: "5"
          HEALTH_MAX_ATTEMPTS: "30"
          HEALTH_RETRY_INTERVAL_SECONDS: "2"
          HEALTH_REQUEST_TIMEOUT_MS: "10000"
        run: |
          sleep "${HEALTH_WARMUP_SECONDS}"
          node <<'EOF'
          const url = process.env.HEALTH_URL;
          const label = process.env.HEALTH_LABEL || "health";
          const maxAttempts = Number(process.env.HEALTH_MAX_ATTEMPTS || 30);
          const retryIntervalMs = Number(process.env.HEALTH_RETRY_INTERVAL_SECONDS || 2) * 1000;
          const requestTimeoutMs = Number(process.env.HEALTH_REQUEST_TIMEOUT_MS || 10000);

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          (async () => {
            if (!url) {
              console.error(JSON.stringify({ probe: label, status: "failed", reason: "missing_health_url" }));
              process.exit(1);
            }

            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), requestTimeoutMs);
              try {
                const response = await fetch(url, {
                  signal: controller.signal,
                  headers: { Accept: "application/json" },
                });
                const body = await response.json().catch(() => null);
                if (response.ok && body?.ok) {
                  console.log(JSON.stringify({ probe: label, status: "ok", attempt }));
                  process.exit(0);
                }
                console.error(JSON.stringify({ probe: label, status: "retry", attempt, httpStatus: response.status, body }));
              } catch (error) {
                console.error(JSON.stringify({ probe: label, status: "retry", attempt, error: String(error) }));
              } finally {
                clearTimeout(timeout);
              }

              if (attempt < maxAttempts) {
                await sleep(retryIntervalMs);
              }
            }

            console.error(JSON.stringify({ probe: label, status: "failed", attempts: maxAttempts }));
            process.exit(1);
          })();
          EOF

      - name: Assistant routing matrix stability gate
        run: pnpm run eval:assistant:routing:stable

      - name: Assistant policy matrix stability gate
        run: pnpm run eval:assistant:policy-matrix:stable

      - name: Assistant perf reliability stability gate
        run: pnpm run eval:assistant:perf-reliability:stable

      - name: Assistant realworld stability gate
        run: pnpm run eval:assistant:realworld:stable

      - name: Assistant backtesting KPI matrix
        run: pnpm run eval:assistant:backtesting:kpi-matrix

      - name: Assistant comprehensive full stability (soft gate)
        id: assistant_full
        continue-on-error: true
        run: pnpm run eval:assistant:full:stable

      - name: Nightly full gate summary
        if: always()
        run: |
          if [ "${{ steps.assistant_full.outcome }}" != "success" ]; then
            echo "assistant_full: soft_fail (non-blocking); inspect artifacts/assistant-eval-comprehensive-report.json" >> $GITHUB_STEP_SUMMARY
          else
            echo "assistant_full: pass" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload assistant artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-assistant-artifacts
          path: |
            artifacts/assistant-routing-matrix-report.json
            artifacts/assistant-policy-matrix-report.json
            artifacts/assistant-perf-reliability-report.json
            artifacts/assistant-realworld-report.json
            artifacts/backtesting-kpi-matrix-report.json
            artifacts/assistant-eval-comprehensive-report.json
            artifacts/assistant-eval-summary.md
          if-no-files-found: warn

      - name: Collect docker logs
        if: always()
        run: docker compose logs --tail=200 app

      - name: Shutdown containers
        if: always()
        run: docker compose down --remove-orphans
