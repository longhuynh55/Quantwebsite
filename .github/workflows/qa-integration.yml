name: QA Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: qa-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  docker-dev-integration:
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate CI data
        run: npm run data:generate:ci

      - name: Start dev app container
        run: docker compose up -d --build app

      - name: Dev smoke
        run: docker compose run --rm smoke

      - name: Dev QA
        run: docker compose run --rm qa

      - name: Dev assistant hallucination eval
        run: docker compose run --rm smoke node scripts/eval-assistant.mjs

      - name: Collect docker logs (dev)
        if: always()
        run: docker compose logs --tail=200 app

      - name: Shutdown containers (dev)
        if: always()
        run: docker compose down --remove-orphans

  docker-prod-integration:
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate CI data
        run: npm run data:generate:ci

      - name: Start prod app container
        run: docker compose --profile prod up -d --build app-prod

      - name: Prod smoke
        run: docker compose --profile prod run --rm smoke-prod

      - name: Prod QA
        run: docker compose --profile prod run --rm qa-prod

      - name: Prod assistant hallucination eval
        run: docker compose --profile prod run --rm smoke-prod node scripts/eval-assistant.mjs

      - name: Collect docker logs (prod)
        if: always()
        run: docker compose logs --tail=200 app-prod

      - name: Shutdown containers (prod)
        if: always()
        run: docker compose --profile prod down --remove-orphans
