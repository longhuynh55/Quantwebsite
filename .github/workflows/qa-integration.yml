name: QA Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: qa-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build

  docker-dev-integration:
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deterministic CI data prepare
        env:
          TZ: UTC
          LANG: C
          LC_ALL: C
        run: pnpm run data:generate:ci

      - name: Deterministic fundamentals validation
        env:
          TZ: UTC
          LANG: C
          LC_ALL: C
        run: pnpm run data:validate:fundamentals

      - name: Start dev app container
        run: docker compose up -d --build app

      - name: Dev health probe warmup and retry
        env:
          HEALTH_URL: http://localhost:3010/api/health/data?probe=true&includeFundamentals=false
          HEALTH_LABEL: dev
          HEALTH_WARMUP_SECONDS: "5"
          HEALTH_MAX_ATTEMPTS: "30"
          HEALTH_RETRY_INTERVAL_SECONDS: "2"
          HEALTH_REQUEST_TIMEOUT_MS: "10000"
        run: |
          sleep "${HEALTH_WARMUP_SECONDS}"
          node <<'EOF'
          const url = process.env.HEALTH_URL;
          const label = process.env.HEALTH_LABEL || "health";
          const maxAttempts = Number(process.env.HEALTH_MAX_ATTEMPTS || 30);
          const retryIntervalMs = Number(process.env.HEALTH_RETRY_INTERVAL_SECONDS || 2) * 1000;
          const requestTimeoutMs = Number(process.env.HEALTH_REQUEST_TIMEOUT_MS || 10000);

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          (async () => {
            if (!url) {
              console.error(JSON.stringify({ probe: label, status: "failed", reason: "missing_health_url" }));
              process.exit(1);
            }

            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), requestTimeoutMs);
              try {
                const response = await fetch(url, {
                  signal: controller.signal,
                  headers: { Accept: "application/json" },
                });
                const body = await response.json().catch(() => null);
                if (response.ok && body?.ok) {
                  console.log(JSON.stringify({ probe: label, status: "ok", attempt }));
                  process.exit(0);
                }
                console.error(JSON.stringify({ probe: label, status: "retry", attempt, httpStatus: response.status, body }));
              } catch (error) {
                console.error(JSON.stringify({ probe: label, status: "retry", attempt, error: String(error) }));
              } finally {
                clearTimeout(timeout);
              }

              if (attempt < maxAttempts) {
                await sleep(retryIntervalMs);
              }
            }

            console.error(JSON.stringify({ probe: label, status: "failed", attempts: maxAttempts }));
            process.exit(1);
          })();
          EOF

      - name: Assistant PR gate stability gate
        run: pnpm run eval:assistant:pr-gate:stable

      - name: Dev smoke
        run: docker compose run --rm smoke

      - name: Dev QA
        run: docker compose run --rm qa

      - name: Dev assistant hallucination eval
        run: docker compose run --rm smoke node scripts/eval-assistant.mjs

      - name: Dev assistant routing matrix gate
        run: pnpm run eval:assistant:routing

      - name: Dev assistant policy matrix stability gate
        run: pnpm run eval:assistant:policy-matrix:stable

      - name: Dev assistant perf reliability stability gate
        run: pnpm run eval:assistant:perf-reliability:stable

      - name: Dev assistant comprehensive stability gate
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: docker compose run --rm -e ASSISTANT_EVAL_PROFILE=quick -e ASSISTANT_EVAL_ENFORCE_DECEPTION=false smoke node scripts/eval-assistant-stability-gate.mjs --suite full

      - name: Collect docker logs (dev)
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color --tail=200 app > artifacts/docker-dev-app.log

      - name: Write QA verdict (dev)
        if: always()
        run: |
          mkdir -p artifacts
          cat > artifacts/qa-verdict-dev.json <<EOF
          {
            "workflow": "qa-integration",
            "job": "docker-dev-integration",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "event_name": "${{ github.event_name }}",
            "status": "${{ job.status }}",
            "generated_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload artifacts and logs (dev)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-dev-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/assistant-*.json
            artifacts/assistant-*.md
            artifacts/docker-dev-app.log
            artifacts/qa-verdict-dev.json
          if-no-files-found: warn

      - name: Shutdown containers (dev)
        if: always()
        run: docker compose down --remove-orphans

  docker-prod-integration:
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deterministic CI data prepare
        env:
          TZ: UTC
          LANG: C
          LC_ALL: C
        run: pnpm run data:generate:ci

      - name: Deterministic fundamentals validation
        env:
          TZ: UTC
          LANG: C
          LC_ALL: C
        run: pnpm run data:validate:fundamentals

      - name: Start prod app container
        run: docker compose --profile prod up -d --build app-prod

      - name: Prod health probe warmup and retry
        env:
          HEALTH_URL: http://localhost:3011/api/health/data?probe=true&includeFundamentals=false
          HEALTH_LABEL: prod
          HEALTH_WARMUP_SECONDS: "5"
          HEALTH_MAX_ATTEMPTS: "30"
          HEALTH_RETRY_INTERVAL_SECONDS: "2"
          HEALTH_REQUEST_TIMEOUT_MS: "10000"
        run: |
          sleep "${HEALTH_WARMUP_SECONDS}"
          node <<'EOF'
          const url = process.env.HEALTH_URL;
          const label = process.env.HEALTH_LABEL || "health";
          const maxAttempts = Number(process.env.HEALTH_MAX_ATTEMPTS || 30);
          const retryIntervalMs = Number(process.env.HEALTH_RETRY_INTERVAL_SECONDS || 2) * 1000;
          const requestTimeoutMs = Number(process.env.HEALTH_REQUEST_TIMEOUT_MS || 10000);

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          (async () => {
            if (!url) {
              console.error(JSON.stringify({ probe: label, status: "failed", reason: "missing_health_url" }));
              process.exit(1);
            }

            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), requestTimeoutMs);
              try {
                const response = await fetch(url, {
                  signal: controller.signal,
                  headers: { Accept: "application/json" },
                });
                const body = await response.json().catch(() => null);
                if (response.ok && body?.ok) {
                  console.log(JSON.stringify({ probe: label, status: "ok", attempt }));
                  process.exit(0);
                }
                console.error(JSON.stringify({ probe: label, status: "retry", attempt, httpStatus: response.status, body }));
              } catch (error) {
                console.error(JSON.stringify({ probe: label, status: "retry", attempt, error: String(error) }));
              } finally {
                clearTimeout(timeout);
              }

              if (attempt < maxAttempts) {
                await sleep(retryIntervalMs);
              }
            }

            console.error(JSON.stringify({ probe: label, status: "failed", attempts: maxAttempts }));
            process.exit(1);
          })();
          EOF

      - name: Assistant PR gate stability gate
        env:
          ASSISTANT_PR_GATE_BASE_URL: http://localhost:3011
          ASSISTANT_EVAL_BASE_URL: http://localhost:3011
        run: docker compose --profile prod run --rm smoke-prod node scripts/eval-assistant-stability-gate.mjs --suite pr-gate

      - name: Prod smoke
        run: docker compose --profile prod run --rm smoke-prod

      - name: Prod QA
        run: docker compose --profile prod run --rm qa-prod

      - name: Prod assistant hallucination eval
        run: docker compose --profile prod run --rm smoke-prod node scripts/eval-assistant.mjs

      - name: Prod assistant policy matrix stability gate
        env:
          ASSISTANT_EVAL_BASE_URL: http://localhost:3011
        run: docker compose --profile prod run --rm smoke-prod node scripts/eval-assistant-stability-gate.mjs --suite policy-matrix

      - name: Prod assistant perf reliability stability gate
        env:
          ASSISTANT_EVAL_BASE_URL: http://localhost:3011
        run: docker compose --profile prod run --rm smoke-prod node scripts/eval-assistant-stability-gate.mjs --suite perf-reliability

      - name: Collect docker logs (prod)
        if: always()
        run: |
          mkdir -p artifacts
          docker compose --profile prod logs --no-color --tail=200 app-prod > artifacts/docker-prod-app.log

      - name: Write QA verdict (prod)
        if: always()
        run: |
          mkdir -p artifacts
          cat > artifacts/qa-verdict-prod.json <<EOF
          {
            "workflow": "qa-integration",
            "job": "docker-prod-integration",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "event_name": "${{ github.event_name }}",
            "status": "${{ job.status }}",
            "generated_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload artifacts and logs (prod)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-prod-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/assistant-*.json
            artifacts/assistant-*.md
            artifacts/docker-prod-app.log
            artifacts/qa-verdict-prod.json
          if-no-files-found: warn

      - name: Shutdown containers (prod)
        if: always()
        run: docker compose --profile prod down --remove-orphans
